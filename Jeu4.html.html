        /************************************************************************
         * FIN DE LA ZONE DE SAISIE
         ************************************************************************/

        let list = listRaw.trim().split('\n').filter(line => line.trim() !== "");
        let indices = [];
        let id = 0;
        let clic = 0;
        let started = false;

        const box = document.getElementById('zone-jeu');

        function shuffle() {
            indices = Array.from(list.keys());
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            id = 0;
        }

        function jouer() {
            if (id >= indices.length) { shuffle(); }

            const realIndex = indices[id];
            const brute = list[realIndex].trim();
            const split = brute.split('=');
            
            const gauchePart = split[0].includes(']') ? split[0].split(']')[1] : split[0];
            const tirageSeul = gauchePart.split('+')[0].trim();
            
            const droitePart = split[1].trim();
            const nbSolutionsStr = droitePart.split('(')[0].trim();
            const nbSolutions = parseInt(nbSolutionsStr);
            
            const matchParentheses = droitePart.match(/\((.*?)\)/);
            const lettreAppui = matchParentheses ? matchParentheses[1] : "";
            const solutionsRaw = droitePart.split(')')[1].trim();

            box.className = (id % 2 === 0) ? 'jaune' : 'pistache';

            if (clic === 0) {
                box.style.fontSize = "4.5rem";
                box.innerHTML = tirageSeul + " + ? = " + nbSolutionsStr;
            } 
            else if (clic === 1) {
                box.innerHTML = tirageSeul + ' + <span class="rouge">(' + lettreAppui + ')</span> = ' + nbSolutionsStr;
            } 
            else {
                // GESTION DES SOLUTIONS (MAX 4)
                if (nbSolutions === 4) {
                    box.style.fontSize = "3.2rem"; // Plus petit pour faire tenir 2 lignes
                    // On remplace le 2ème slash par un saut de ligne pour forcer 2x2
                    const mots = solutionsRaw.split('/');
                    box.innerHTML = mots[0] + "/" + mots[1] + "<br>" + mots[2] + "/" + mots[3];
                } else {
                    box.style.fontSize = "4.2rem"; // Taille normale pour 2 ou 3 solutions
                    box.innerHTML = solutionsRaw;
                }
            }
        }

        box.addEventListener('click', () => {
            if (!started) {
                if (list.length === 0) return;
                shuffle();
                started = true;
                jouer();
                return;
            }
            clic++;
            if (clic > 2) {
                clic = 0;
                id++;
                jouer();
            } else {
                jouer();
            }
        });
    </script>
