        }

            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease-in-out;
            position: relative;
            min-height: 140px;
        }

        .bouton:hover { 
            background: linear-gradient(145deg, #FFE44D, #FFD700);
            transform: translateY(2px);
            box-shadow: 0 8px 0 #996515, 0 12px 15px rgba(0,0,0,0.4);
        }

        .bouton:active {
            transform: translateY(10px);
            box-shadow: 0 0 0 #996515, 0 5px 10px rgba(0,0,0,0.3);
        }

        .picto-container {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .symbole-carte {
            font-size: 1.2em;
        }

        @media (max-width: 900px) {
            .menu { grid-template-columns: 1fr; }
        }
    </style>
</head>
